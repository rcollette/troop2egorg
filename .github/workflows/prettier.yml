name: Prettier

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    name: format:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
